# 结构化错误日志（.codebuddy/rules/log-structured.mdc 的规则引擎迁移，PR-1）：
# log_error / log_fault（含派生宏与条件变体）输出必须携带 err_code 与 err_msg
# 结构化字段；无明确错误码时 err_code 填 -1。
# 语句级判定：跨行拼接按整条语句（AST expression_statement 跨度）判定字段存在性；
# 注释行无语句节点 → 剔除（根治 regex 误报注释的历史问题）。
id: CPP_LOG_STRUCTURED_MISSING_FIELDS
enabled: true
name: "log_error/log_fault 输出必须包含 err_code 与 err_msg 结构化字段"
severity: warn
engine_requires: [regex]
applies_to:
  languages: [cpp]
  exclude_glob:
    - "**/third_party/**"
    - "**/vendor/**"
patterns:
  - id: log_stream_out
    description: "log_error/log_fault 流式输出（含派生宏与条件变体）"
    spec:
      type: Raw
      value:
        pattern: '(?i)\blog_(error|fault)[A-Za-z0-9_]*\s*<<'
conditions:
  all:
    - kind: StatementMissingAny
      body_patterns: ["err_code", "err_msg"]
meta:
  rationale: "无结构化字段的错误日志无法被日志平台检索与告警聚合，故障定位成本高"
  fix_suggestion: "保留原日志输出内容，并在语句分号前追加 << \"err_code : -1, err_msg : <错误描述>\"；有明确错误码时填真实值"
  fix_suggestion_template:
    template: |
      // 保留原日志内容，在同一条流式输出语句末尾补齐结构化字段；有明确错误码时把 -1 替换为真实值：
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      fixed_line:
        from: issue_line
        regex: '\s*;\s*$'
        replace_with: ' << "err_code : -1, err_msg : <错误描述>";'
  references:
    - ".codebuddy/rules/log-structured.mdc"
  tapd_ids: ["1070112211134320991"]
  tags: ["log-structured", "paradigm", "context_aware_suggestion"]
