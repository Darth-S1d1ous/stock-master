id: OBJC_FUNCTION_LENGTH_THRESHOLD
enabled: true
name: "Objective-C/Objective-C++ 单方法有效代码行大于 80"
severity: warn
applies_to:
  languages: [objc, objcpp]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: function_length
      op: at_least
      threshold: 81
meta:
  rationale: "方法有效代码行不含空行和纯注释行；超过 80 行通常意味着职责过多。"
  fix_suggestion: "当前函数有效代码行超过 80 行阈值，需要优化；保留原方法入口，将视图初始化、数据绑定和状态处理提取为私有方法。"
  tapd_ids: ["1070112211160112440"]
  tags: [ios, objc, objcpp, code_quality, function_length, ast]
