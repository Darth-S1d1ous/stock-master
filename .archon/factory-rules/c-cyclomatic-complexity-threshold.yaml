id: C_CYCLOMATIC_COMPLEXITY_THRESHOLD
enabled: true
name: "C 单函数圈复杂度大于 20"
severity: warn
applies_to:
  languages: [c]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: cyclomatic_complexity
      op: at_least
      threshold: 21
meta:
  rationale: "圈复杂度大于 20 的 C 函数控制流过于复杂，容易隐藏资源释放和错误处理缺陷。"
  fix_suggestion: "当前函数圈复杂度超过 20 阈值，需要优化；保留原函数入口，将条件判定、资源处理和错误路径提取为静态辅助函数。"
  references: ["McCabe cyclomatic complexity"]
  tags: [c, dtmp, code_quality, cyclomatic_complexity, ast]
