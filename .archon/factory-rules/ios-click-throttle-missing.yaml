# 用户交互事件缺少防抖/防重复保护
# TAPD Bug 1070112211161699389：追问表单选项点击重复上报
id: IOS_CLICK_THROTTLE_MISSING
enabled: true
name: "iOS 点击事件处理函数必须含防抖（YBThrottler / debounce / canFire）"
severity: warn
engine_requires: [ast]
applies_to:
  languages: [objc]
patterns:
  - id: click_handler
    spec:
      type: Any
      value:
        # handleTap 方法定义 — ObjC AST extract_function_name 返回完整 selector
        # "handleTap"，MethodCall{method:"handleTap"} 匹配 method_definition 节点。
        # objc_method_definition_only AST tag 精确过滤 @selector 字面量 FP。
        - { type: MethodCall, value: { method: "handleTap" } }
        # tableView:didSelectRowAtIndexPath: — 多段 ObjC selector，
        # extract_function_name 返回 "tableView:didSelectRowAtIndexPath:"
        - { type: MethodCall, value: { method: "tableView:didSelectRowAtIndexPath:" } }
        # onClick / onTap handler — 单段 selector
        - { type: MethodCall, value: { method: "onClick" } }
        - { type: MethodCall, value: { method: "onClick:" } }
        - { type: MethodCall, value: { method: "onTap" } }
        - { type: MethodCall, value: { method: "onTap:" } }
        # gestureRecognizer:...state == UIGestureRecognizerStateEnded
        # compound pattern：selector + state 比较，AST 无变体可表达，Raw 逃生舱（§6.2.3）
        - { type: Raw, value: { pattern: 'gestureRecognizer:[^}]*state\s*==\s*UIGestureRecognizerStateEnded' } }
  - id: throttle_mechanism
    spec:
      type: Any
      value:
        # Throttler/debounce 在 ObjC 中是类名/关键词引用（非方法调用），Raw 合理
        - { type: Raw, value: { pattern: 'Throttler' } }
        - { type: Raw, value: { pattern: 'debounce' } }
        - { type: MethodCall, value: { method: "canFire" } }
        # 手动状态守卫：self.selecting / self.isExpanding / self.isPresenting 等布尔状态防抖
        # 匹配 if 语句中含 self.xxx（状态布尔字段），不需完整 if 条件（支持 || / && 组合）
        - { type: Raw, value: { pattern: 'self\.\w*(selecting|expanding|presenting|showing|loading|processing|busy|animating)\w*' } }
  # 业务副作用 API：文件含以下任一**真实业务 IO/网络/上报** API 才视为"需要防抖"
  # 收紧关键词（v1 过宽导致所有 iOS UI 文件命中）：
  #   - 排除 input/edit/animation/model/update/load 等通用 UI 词
  #   - 仅保留真实业务 IO：网络请求/上报埋点/持久化存储/路由跳转
  #   - 使用单词边界（\b）避免误匹配，但允许 report*/track*/send* 等前缀命名变体
  - id: side_effect_api
    spec:
      type: Any
      value:
        # 网络请求（iOS：NSURLSession/AFHTTPSessionManager；Android：OkHttp/Retrofit）
        - { type: Raw, value: { pattern: '(?i)NSURLSession|AFHTTPSessionManager|AFHTTPRequestSerializer|OkHttp|Retrofit|URLSession|http_session|http_request' } }
        # 网络方法调用：upload/sendRequest/POST/GET/fetch（精确单词边界）
        - { type: Raw, value: { pattern: '(?i)\b(uploadTask|dataTask|sendRequest|POST|GET|fetchRequest|sendReq)\b' } }
        # 上报埋点：report*/track*/log_event（含命名变体如 reportClick/reportData/trackEvent 等）
        - { type: Raw, value: { pattern: '(?i)\b(report[A-Z]\w*|track[A-Z]\w*|log_event|beaconReport|TRTCReport)\b' } }
        # 单独的 report/track 单词调用（reportClick、track 等）
        - { type: Raw, value: { pattern: '(?i)\b(reportClick|reportData|reportEvent|trackEvent|trackAction)\b' } }
        # 持久化存储：database/sqlite/userDefault/file_write
        - { type: Raw, value: { pattern: '(?i)\b(sqlite|database|userDefault|NSUserDefaults|writeToFile|saveToDisk|file_write)\b' } }
        # 路由跳转（精确 navigationController.push/present）
        - { type: Raw, value: { pattern: 'navigationController\.push|pushViewController|presentViewController' } }
        # 上报网络（变体）
        - { type: Raw, value: { pattern: '(?i)\b(api_request|http_request|network_request|request_api)\b' } }
conditions:
  all:
    - kind: NotHas
      node: throttle_mechanism
    # 文件必须含业务副作用 API（否则就是纯 UI 切换 handler，不需要防抖）
    - kind: Has
      node: side_effect_api
meta:
  rationale: |
    点击事件处理函数缺少防抖机制，快速连续点击会重复触发业务逻辑
    （上报/上屏/状态变更）。常见表现：
    - 同一选项在短时间内被多次上报
    - 按钮快速双击导致重复提交
    - 手势识别器快速触发导致重复动画

    iOS 标准防抖方案：使用项目封装的 `YBThrottler`，初始化时指定 interval
    （通常 1.0s 或 500ms），在事件处理函数入口调用 `canFire` 判断。

    适用范围：
    - didSelectRowAtIndexPath:
    - onClick / onTap / handleTap
    - UITapGestureRecognizer handler
    - IBAction 按钮 click 事件
  fix_suggestion: |
    // 在报告的 {{method_name}} 方法所在文件内：
    // 1. 文件级声明 throttler singleton（命名建议：YB<MethodName>Throttler）
    static YBThrottler *{{throttler_name}}(void) {
        static YBThrottler *throttler = nil;
        static dispatch_once_t onceToken;
        dispatch_once(&onceToken, ^{
            throttler = [[YBThrottler alloc] initWithInterval:1.0];
        });
        return throttler;
    }

    // 2. 在报告的方法（{{method_name}}）入口加 canFire 守卫：
    - (void){{method_name}} {
        if (![{{throttler_name}}() canFire]) return;  // 防抖检查
        // ... 原有逻辑
    }
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：在方法体 { 后插入 YBThrottler.canFire 节流守卫
  # 用 replace_with 在 { 后插入守卫行（保留原方法签名）
  fix_suggestion_template:
    template: |
      // {{method_name}} 缺节流，连续点击会重复触发业务，使用 YBThrottler 守卫
      // 在方法体 { 后插入节流守卫（保留原方法签名）：
      - {{original_line}}
      + {{method_sig}} {
      +     if (![YBThrottler canFire:@"{{method_name}}"]) return;
    extractors:
      method_name:
        from: issue_line
        regex: '\b(handleTap|onTap|onClick|tableView:didSelectRowAtIndexPath:)\b'
        group: 1
        default: handleTap
      method_sig:
        from: issue_line
        # 提取方法签名（到 { 之前），如 `- (void)onTap`
        regex: '^(\s*[-+]\s*\([^)]*\)\s*\w+)'
        group: 1
        default: '    - (void)onTap'
  references: []
  tapd_ids: ["1070112211161699389"]
  tags: [ios, objc, interaction, throttle, debounce, ui, ux, objc_method_definition_only, objc_callback_forwarder_safe, objc_manual_throttle_safe, context_aware_suggestion]
