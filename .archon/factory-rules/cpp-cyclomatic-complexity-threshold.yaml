id: CPP_CYCLOMATIC_COMPLEXITY_THRESHOLD
enabled: true
name: "C++ 单函数圈复杂度大于 20"
severity: warn
applies_to:
  languages: [cpp]
  exclude_glob:
    - "**/3rd/**"
    - "**/3rdparty/**"
    - "**/third_party/**"
    - "**/vendor/**"
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: cyclomatic_complexity
      op: at_least
      threshold: 21
meta:
  rationale: "圈复杂度大于 20 的 C++ 函数控制流过于复杂，难以验证资源和错误路径。"
  fix_suggestion: "当前函数圈复杂度超过 20 阈值，需要优化；保留原函数入口，将复合条件和独立处理阶段提取为命名辅助函数。"
  tapd_ids: ["1070112211159686712"]
  tags: [cpp, dtmp, desktop, code_quality, cyclomatic_complexity, ast]
