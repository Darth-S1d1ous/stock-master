# Kotlin 协程 resume 前必须检查 continuation.isActive
# TAPD Bug 1070112211153911774
id: KOTLIN_CONTINUATION_RESUME_MUST_CHECK_ISACTIVE
enabled: true
name: "Kotlin CancellableContinuation resume 前必须检查 isActive"
severity: error
engine_requires: [ast, regex]
applies_to:
  languages: [kotlin]
patterns:
  - id: continuation_resume
    spec:
      type: Any
      value:
        - { type: MethodCall, value: { method: "resume", receiver_name: "{continuation,cont,coroutine,deferred,job}" } }
        - { type: MethodCall, value: { method: "resumeWithException", receiver_name: "{continuation,cont,coroutine,deferred,job}" } }
  - id: isactive_check
    spec: { type: Raw, value: { pattern: '\.isActive\b' } }
conditions:
  all:
    - kind: NotHas
      node: isactive_check
meta:
  rationale: |
    Kotlin CancellableContinuation（suspendCancellableCoroutine 返回）在协程被取消后
    调用 resume() 会抛 AlreadyResumedException。
    文件级关键词过滤：文件必须包含 suspendCancellableCoroutine 才报告。
  fix_suggestion: |
    resume 前检查 isActive，防止协程取消后 AlreadyResumedException：

    // 当前代码（有风险）：
    yourVar.resume(result)  // yourVar 可能是 continuation/cont/coroutine

    // 修复后（使用实际变量名替换 yourVar）：
    if (yourVar.isActive) {
        yourVar.resume(result)
    }
    #keywords: suspendCancellableCoroutine
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：用 replace_with 把 receiver.resume(args) 子串
  # 替换为 if (receiver.isActive) receiver.resume(args)，保留原行的缩进、
  # 末尾分号等上下文。
  fix_suggestion_template:
    template: |
      // {{var_name}}.resume 前未检查 isActive → 协程取消后 AlreadyResumedException
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      var_name:
        from: issue_line
        regex: '\b(\w+)\.resume(?:WithException)?\s*\('
        group: 1
        default: continuation
      fixed_line:
        from: issue_line
        # 匹配 receiver.resume(...) 或 receiver.resumeWithException(...) 子串
        # group1=receiver 变量名，group2=方法名，group3=参数列表
        # replace_with 包裹 if (receiver.isActive) 前缀，保留方法调用本身
        regex: '\b(\w+)(\.resume(?:WithException)?)\s*\(\s*([^)]*)\)'
        replace_with: 'if (${1}.isActive) ${1}${2}(${3})'
  references: ["CWE-248"]
  tapd_ids: ["1070112211153911774"]
  tags: [android, kotlin, coroutine, crash, lifecycle, async, cancellation, function_keyword_filter, context_aware_suggestion]
