# Android 禁止硬编码 .sp 字号，必须使用 YBTheme.ybStandardFont 动态字号
# TAPD Bug 1070112211157198529 / 1070112211157116763 / 1070112211153407683：硬编码 sp 字号
id: ANDROID_DYNAMIC_FONT_NO_HARDCODED_SP
enabled: true
name: "Android Compose Text 禁止硬编码 N.sp，必须用 YBTheme.ybStandardFont"
severity: error
engine_requires: [ast, regex]
applies_to:
  languages: [kotlin]
  # 排除动态字号体系自身的定义文件（必然含 N.sp，因为是字号档位源定义）
  # YBFontStandard.kt: 定义 fontStandard0/1/2/3...font14 字号档位
  # YBTypography.kt: YBTypography 类定义，提供 ybStandardFont 入口
  # YBTheme.kt: YBTheme 主题入口，提供 ybStandardFont 字段
  exclude_glob:
    - "**/theme/YBTypography.kt"
    - "**/theme/YBFontStandard.kt"
    - "**/theme/YBTheme.kt"
    - "**/compose/theme/YB*.kt"
    - "**/ui/theme/YB*.kt"
patterns:
  - id: hardcoded_sp
    spec:
      type: Any
      value:
        # fontSize = N.sp 直接写法
        - { type: Raw, value: { pattern: 'fontSize\s*=\s*\d+(?:\.\d+)?\.sp' } }
        # lineHeight = N.sp 直接写法
        - { type: Raw, value: { pattern: 'lineHeight\s*=\s*\d+(?:\.\d+)?\.sp' } }
        # TextStyle(fontSize = N.sp) 包裹写法
        - { type: Raw, value: { pattern: 'TextStyle\s*\([^)]*fontSize\s*=\s*\d+(?:\.\d+)?\.sp' } }
        - { type: Raw, value: { pattern: 'TextStyle\s*\([^)]*lineHeight\s*=\s*\d+(?:\.\d+)?\.sp' } }
  - id: dynamic_font_token
    spec: { type: Raw, value: { pattern: 'YBTheme\.ybStandardFont' } }
conditions:
  all:
    - kind: NotHas
      node: dynamic_font_token
meta:
  rationale: |
    项目（腾讯元宝 Android）封装了动态字号体系 `YBTheme.ybStandardFont.fontN`
    （iOS 端对应 `YBTheme.ybAndroidStandardFont`），通过 `LocalTypography.current`
    读取用户字号偏好。硬编码 `N.sp` 会绕过该体系，导致：

    1. 字号不联动：用户调整系统/App 字号时该 Text 不随之缩放
    2. 同页面断层：周围 Text 都变大、唯独硬编码 sp 的 Text 不变
    3. 无障碍不合规：破坏 Android 系统字号可访问性要求
    4. 双端不一致：iOS 默认接入动态字号，Android 漏接会造成跨端体验差异

    正确写法分两档：
    - 简单 Text：`style = YBTheme.ybStandardFont.font14`
    - 需要保留其他属性：`YBTheme.ybStandardFont.font13.copy(fontFamily = ...)`
  fix_suggestion: |
    # 简单场景：直接替换 fontSize 为 style
    - fontSize = 14.sp
    + style = YBTheme.ybStandardFont.font14

    # 需要保留其他属性：用 .copy() 接入
    - style = TextStyle(
    -     fontSize = 13.sp,
    -     lineHeight = 20.sp,
    -     fontFamily = FontFamily.Monospace
    - )
    + style = YBTheme.ybStandardFont.font13.copy(
    +     fontFamily = FontFamily.Monospace
    + )
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律（来自 TAPD 单据）：
  # - lhs 改名：fontSize/lineHeight → style（Compose Text API 要求 style 接管字号）
  # - rhs 改写：N.sp → YBTheme.ybStandardFont.fontN
  # - 保留：缩进 + 末尾逗号（函数参数场景）
  fix_suggestion_template:
    # 真实修复规律（TAPD）：在原行中把 `(fontSize|lineHeight) = N.sp` 子串替换为
    # `style = YBTheme.ybStandardFont.fontN`，保留 Text() 调用的其他参数
    template: |
      // 硬编码 {{sp_value}}.sp 绕过动态字号体系 YBTheme.ybStandardFont
      // 在原 Text() 调用中把 fontSize/lineHeight = N.sp 替换为 style = YBTheme.ybStandardFont.fontN：
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      sp_value:
        from: issue_line
        # 支持整数（14.sp）和浮点（16.8.sp）
        regex: '(\d+(?:\.\d+)?)\.sp\b'
        group: 1
      fixed_line:
        from: issue_line
        # 支持整数 + 浮点 sp 值（如 14.sp / 16.8.sp）
        regex: '(fontSize|lineHeight)\s*=\s*(\d+(?:\.\d+)?)\.sp'
        replace_with: 'style = YBTheme.ybStandardFont.font$2'
  references: []
  tapd_ids: ["1070112211157198529", "1070112211157116763", "1070112211153407683"]
  tags: [android, kotlin, compose, accessibility, theme, font, hardcoded, context_aware_suggestion]
