# C++ 废弃 API（GetBooleanValue）必须替换为 ShiplyConfig::Get()
# TAPD Bug 1070112211159149135：video_render_native_renderer_switch 使用废弃 GetBooleanValue
#
# 设计说明：本规则与 CPP_RESHARPER_DEPRECATED_SHIPLY_CONFIG 在 NetworkConfigService API
# 上有部分重叠。两者都检测 ->GetStringValue，但本规则额外覆盖 ->GetBooleanValue/GetIntValue/
# GetDoubleValue（具体 NetworkConfigService 实例方法调用），RE 规则覆盖 NetConfigBool/Int/String
# （静态 facade 函数）。实际场景：用户在文件中加 `// archon:suppress CPP_NO_DEPRECATED_GETBOOLEANVALUE`
# 可消除重复。两条规则各自有独立 TAPD ID 追溯。
id: CPP_NO_DEPRECATED_GETBOOLEANVALUE
enabled: true
name: "C++ 禁止使用废弃 GetBooleanValue / QueryNetworkConfigService，必须用 ShiplyConfig::Get"
severity: warn
engine_requires: [regex]
applies_to:
  languages: [cpp]
  # 排除 NetworkConfigService / NetworkConfigItem 实现层自身：
  # 这些文件是废弃 API 的实现，不能不调用自身
  exclude_glob:
    - "**/network_config_item_impl.cc"
    - "**/network_config_item.h"
    - "**/network_config_service_impl.cc"
    - "**/network_config_service_impl.h"
    - "**/network_config_service.h"
patterns:
  # 仅检测 NetworkConfigService 实例的 GetXxxValue 方法调用
  # 用 Raw 复合模式限定 receiver（避免 BlitzDependBizService 等同名方法误伤）：
  # - config_service / config_svc / config / network_config_service：常见变量名
  # - QueryNetworkConfigService()：静态 facade 调用
  # 排除 BlitzDepend / QueryBlitz / BlitzConfig / OtherService 等同名场景。
  # 用 MethodCall pattern 在 C++ AST 上对 -> 调用的 receiver 提取失败，故用 Raw。
  - id: deprecated_getbooleanvalue
    spec:
      type: Raw
      value:
        pattern: '(?:\b(?:config_service|config_svc|network_config_service|config|svc)\s*(?:\.|->)\s*Get(?:Boolean|Int|Int64|String|Double|Float)Value\s*\()|(?:QueryNetworkConfigService\s*\(\s*\)\s*(?:\.|->)\s*Get(?:Boolean|Int|Int64|String|Double|Float)Value\s*\()'
conditions:
  all:
    - kind: InModule
      module_glob: "**/dtmp/**"
meta:
  rationale: |
    DTMP::QueryNetworkConfigService()->GetBooleanValue(key, default) 已被标记为
    deprecated（__attribute__((deprecated))），编译器会持续产生 -Wdeprecated-declarations
    警告。新接口 DTMP::ShiplyConfig::Get(ABKeyAutoExposure<T>) 提供强类型键和统一治理。

    废弃 API 不治理会持续扩散：开发者复制粘贴旧用法、CI 警告噪音淹没真正严重问题。

    正确做法：
    1. 替换 key 类型为 ABKeyAutoExposure<bool>{"name", default}
    2. 调用 DTMP::ShiplyConfig::Get(key)
    3. 包含 <dtmp/services/biz/abkit/abkit_facade.h>

    废弃 API 整个 NetworkConfigService 已被 ShiplyConfig + ABKit 取代，即使
    调用方不立即用 GetBooleanValue，持有 service 引用本身也意味着走旧管道。
  fix_suggestion: |
    命中的 GetXxxValue 调用已废弃，替换为 ShiplyConfig::Get<T>：

    // 反例（当前代码）：
    config_service->GetXxxValue(key, default_value);  // GetBooleanValue/GetInt64Value 等

    // 正例（按返回类型选择 ShiplyConfig::Get<T>）：
    #include <dtmp/services/biz/abkit/abkit_facade.h>
    // GetBooleanValue → bool, GetIntValue/GetInt64Value → int32_t/int64_t,
    // GetStringValue → std::string, GetDoubleValue/GetFloatValue → double
    DTMP::ABKit::ABKeyAutoExposure<T> kKey{"your.config.key", default_value};
    auto value = DTMP::ShiplyConfig::Get(kKey);
    #exclude: NetworkConfigServiceImpl, jni_config, NetworkConfigService class definition
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律（TAPD 1070112211159149135）：
  # 用 replace_with 在原行中把 receiver->GetXxxValue(args) 子串
  # 替换为 DTMP::ShiplyConfig::Get(DTMP::ABKit::ABKeyAutoExposure<T>{args})，
  # 保留 return / 缩进 / 末尾分号等上下文。
  # cpp_type 由 GetXxxValue 方法名 lookup 映射（bool/int64_t/int32_t/...）。
  # replace_with 不支持引用其他 extractor 变量（{{cpp_type}}），
  # 因此用 alternation regex 把方法名分支编码进 capture group：
  # - 6 条 alternation 分支（GetBooleanValue|GetInt64Value|...），每条分支
  #   匹配特定方法名，replace_with 输出对应 cpp_type 字面
  # - 6 条 regex 互斥（只命中一个），replace_with 不需判断哪个分支匹配
  # 用 lookup 表生成 {{cpp_type}} 用于注释展示，replace_with 直接产出 cpp_type 字面
  fix_suggestion_template:
    template: |
      // {{method_name}}() 已废弃，替换为 ShiplyConfig::Get<{{cpp_type}}>
      // 需 #include <dtmp/services/biz/abkit/abkit_facade.h> 并声明 ABKit key
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      method_name:
        from: issue_line
        regex: 'Get(Boolean|Int64|Int|String|Double|Float)Value'
        group: 0
        default: GetXxxValue
      cpp_type:
        from: issue_line
        regex: 'Get(Boolean|Int64|Int|String|Double|Float)Value'
        group: 0
        lookup:
          GetBooleanValue: bool
          GetInt64Value: int64_t
          GetIntValue: int32_t
          GetStringValue: std::string
          GetDoubleValue: double
          GetFloatValue: float
        default: T
      fixed_line:
        from: issue_line
        # replace_with 在原行中替换 receiver->GetXxxValue(args) 子串，
        # 保留 return 前缀、receiver、参数列表、末尾分号等上下文。
        # group1=前缀（return / auto x = / 缩进），group2=receiver 变量名，
        # group3=参数列表（key, default），多行调用时 group3 为空
        # {{cpp_type}} 引用阶段 1 lookup 提取的类型字面（bool/int64_t/int32_t/...）
        # 多行场景（参数在后续行）：保留行尾 ( 不闭合，注释提示补完参数
        # 单行场景：完整替换为 ShiplyConfig::Get(ABKeyAutoExposure<T>{key, default})
        regex: '^(\s*.*?)([\w:.]+(?:\(\))?)\s*(?:\.|->)\s*Get(?:Boolean|Int64|Int|String|Double|Float)Value\s*\(([^)]*?)(\)|$)'
        replace_with: '${1}DTMP::ShiplyConfig::Get(DTMP::ABKit::ABKeyAutoExposure<{{cpp_type}}>{${3}})${4}'
  references: []
  tapd_ids: ["1070112211159149135"]
  tags: [cpp, deprecated, code_quality, shiply, abkit, file_keyword_exclude, context_aware_suggestion]
