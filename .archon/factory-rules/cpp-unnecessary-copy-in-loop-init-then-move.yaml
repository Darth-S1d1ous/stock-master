# 循环内临时变量先赋值（深拷贝）再 move 到容器
# TAPD Bug 1070112211161760758 P1：project_biz_service_impl.cc:731
#
# 反模式（AST 结构）：
#   for_statement
#   ├── declaration (Variant item(0);)         ← VariableDef
#   ├── assignment_expression (item = model;)  ← Assignment
#   └── call_expression (emplace_back(std::move(item))) ← Call + Within for
#
# 修复：直接 emplace_back(src)，由容器原地构造。
#
# 2026-08-14 修复：用 FunctionBodyContains（同函数范围检查）替代 Has（文件级检查），
# 确保 `item = src` 整体赋值与 push_back(std::move(item)) 在同一函数内，
# 避免跨函数误匹配（Has 是文件级，另一函数的 item 赋值会误触发）。
id: CPP_UNNECESSARY_COPY_IN_LOOP_INIT_THEN_MOVE
enabled: true
name: "C++ 循环内临时变量先赋值（深拷贝）再 move 到容器，应直接 emplace_back"
severity: warn
engine_requires: [regex]
applies_to:
  languages: [cpp]
patterns:
  # 只匹配 push_back/emplace_back(std::move(item)) —— 触发行
  # VariableDef / Assignment 检查改为 FunctionBodyContains（同函数范围）
  - id: emplace_move_call
    spec:
      type: Raw
      value:
        # 匹配 push_back/emplace_back(std::move(item)) 中的 item 变量
        pattern: '(?:emplace(?:_back)?|push_back)\s*\(\s*std::move\s*\(\s*item\s*\)\s*\)'
conditions:
  all:
    - kind: InModule
      module_glob: "**/dtmp/**"
    # 同函数体内必须含 `item = ` 整体赋值（非字段赋值 item.xxx = ）
    # `(?m)` multiline flag：让 ^ 匹配函数体每一行行首（collect_body_text 是多行文本）
    # 排除 `item.field =` / `item ==` / `item.field ==`
    - kind: FunctionBodyContains
      body_patterns:
        - '(?m)^\s*item\s*=[^=.]'
    # 排除缓冲复用模式：同函数内含 .clear()
    - kind: FunctionBodyNotContains
      body_patterns:
        - '\.clear\s*\(\s*\)'
    # push_back(std::move(item)) 必须在 for 循环内
    - kind: Within
      scope: "for"
meta:
  rationale: |
    循环内临时变量先赋值再 move 到容器，等价于多一次堆内存分配：
    - `Type tmp(...); tmp = src;`：先默认构造 tmp，再赋值（触发 std::string/operator= 深拷贝）
    - `container.emplace_back(std::move(tmp))`：move 已晚，深拷贝已发生

    正确写法（修复后）：
    ```cpp
    for (const auto& src : items) {
        container.emplace_back(src);  // 直接构造，无深拷贝
    }
    ```

    检测策略（2026-08-14 修复后）：
    1. Raw pattern 匹配 `emplace_back(std::move(item))` 触发行（Within for 检查）
    2. FunctionBodyContains `(?m)^\s*item\s*=[^=.]` 确保**同函数内**有 `item = src` 整体赋值
       （排除字段赋值 `item.field =` 和比较 `item ==`）
    3. FunctionBodyNotContains `.clear()` 排除缓冲复用模式

    TAPD Bug 1070112211161760758 P1：
    `DTMP/DTMP/services/biz/project/project_biz_service_impl.cc:731`
  fix_suggestion: |
    // 当前代码（多一次深拷贝）：
    for (const auto& src : items) {
        Type tmp(...);
        tmp = src;
        container.emplace_back(std::move(tmp));
    }

    // 修复后（直接 emplace_back，无深拷贝）：
    for (const auto& src : items) {
        container.emplace_back(src);
    }
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：用 replace_with 把 `emplace_back(std::move(item))` 或
  # `push_back(std::move(item))` 子串替换为 `emplace_back(src)`，
  # 保留 container receiver、末尾分号等上下文。
  fix_suggestion_template:
    template: |
      // 循环内先深拷贝再 move 到 {{container}}，产生不必要的拷贝
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      container:
        from: issue_line
        regex: '(\w+)\.(?:emplace_back|push_back)\s*\('
        group: 1
        default: 'container'
      fixed_line:
        from: issue_line
        # 匹配 emplace_back(std::move(item)) 或 push_back(std::move(item)) 子串
        # group1=方法名（emplace_back 或 push_back），group2=被 move 的变量名
        # replace_with 替换为 <method>(<var>)，保留 container. 前缀和末尾分号
        regex: '(emplace_back|push_back)\s*\(\s*std::move\s*\(\s*(\w+)\s*\)\s*\)'
        replace_with: '${1}(${2})  // 直接 emplace，无深拷贝'
  references: ["clang-tidy:performance-unnecessary-copy-initialization"]
  tapd_ids: ["1070112211161760758"]
  tags: [cpp, performance, code_quality, copy, loop, emplace_back, std::move, context_aware_suggestion]
