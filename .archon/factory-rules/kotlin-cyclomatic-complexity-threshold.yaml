id: KOTLIN_CYCLOMATIC_COMPLEXITY_THRESHOLD
enabled: true
name: "Kotlin 单方法圈复杂度大于 20"
severity: warn
applies_to:
  languages: [kotlin]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: cyclomatic_complexity
      op: at_least
      threshold: 21
meta:
  rationale: "圈复杂度大于 20 的 Kotlin 方法分支组合过多，难以覆盖和安全修改。"
  fix_suggestion: "当前函数圈复杂度超过 20 阈值，需要优化；保留原方法入口，将 when 分支、条件组合和循环处理提取为语义明确的函数。"
  references: ["McCabe cyclomatic complexity"]
  tags: [kotlin, android, code_quality, cyclomatic_complexity, ast]
