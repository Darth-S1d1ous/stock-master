id: CPP_FUNCTION_LENGTH_THRESHOLD
enabled: true
name: "C++ 单函数有效代码行大于 80"
severity: warn
applies_to:
  languages: [cpp]
  exclude_glob:
    - "**/3rd/**"
    - "**/3rdparty/**"
    - "**/third_party/**"
    - "**/vendor/**"
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: function_length
      op: at_least
      threshold: 81
meta:
  rationale: "函数有效代码行不含空行和纯注释行；超过 80 行通常意味着职责过多。"
  fix_suggestion: "当前函数有效代码行超过 80 行阈值，需要优化；保留原函数入口，将输入校验、状态转换和资源操作提取为辅助函数。"
  references: ["Archon effective function length policy"]
  tags: [cpp, dtmp, desktop, code_quality, function_length, ast]
