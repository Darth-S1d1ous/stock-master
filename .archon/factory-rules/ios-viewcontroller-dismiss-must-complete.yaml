# iOS 异步 completion block 必须 @weakify(self)
id: IOS_ASYNC_COMPLETION_MUST_WEAKIFY_SELF
enabled: true
name: "iOS 异步 completion block 必须 @weakify(self)"
severity: error
engine_requires: [ast]
applies_to:
  languages: [objc]
patterns:
  - id: async_completion
    spec:
      type: Any
      value:
        - { type: MethodCall, value: { method: "requestAiMotionAccess" } }
        - { type: MethodCall, value: { method: "requestPhotoAccess" } }
        - { type: MethodCall, value: { method: "requestAccess" } }
        - { type: MethodCall, value: { method: "fetchWithCompletion" } }
  - id: weakify_self
    spec: { type: Annotated, value: { annotation: "weakify" } }
conditions:
  all:
    - kind: NotHas
      node: weakify_self
    - kind: ClassScope
      class_glob: "*{View,Cell,Panel,Controller,VC,Fragment}*"
meta:
  rationale: |
    iOS 异步 completion block 强捕获 self，VC dismiss 后泄漏。
    ClassScope 根据 ObjC 实际类名限定 View/Cell/Panel/Controller/VC/Fragment，
    不依赖仓库目录或文件命名约定，并排除 Utils/Tools 工具类。
  fix_suggestion: |
    异步 completion block 强引用 self → VC dismiss 后泄漏。修复模式：

    // 当前代码（有风险）：
    [SomeTool requestSomething:^(id result) {
        // block 内通过 self.xxx / [self method] 引用 self → retain cycle
        [self.dataArray reloadData];
    }];

    // 修复后：
    @weakify(self);  // ← 在异步调用前添加
    [SomeTool requestSomething:^(id result) {
        @strongify(self);  // ← block 首行添加
        if (!self) return;  // ← nil 守卫
        [self.dataArray reloadData];  // 原有逻辑
    }];
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：识别实际异步 API 名（requestAiMotionAccess/requestPhotoAccess/...）
  # 在调用前插入 @weakify(self); block 内首行加 @strongify(self);
  fix_suggestion_template:
    template: |
      // {{api_name}} 异步 block 强引用 self → VC dismiss 后泄漏，应 weakify/strongify
      - {{original_line}}
      + {{indent}}@weakify(self);
      + {{indent}}{{trimmed_line}}
      + {{indent}}    @strongify(self);
    extractors:
      api_name:
        from: issue_line
        regex: '(requestAiMotionAccess|requestPhotoAccess|requestAccess|fetchWithCompletion)'
        group: 1
        default: async API
  references: ["CWE-401", "clang-static-analyzer:retain-cycle"]
  tapd_ids: ["1070112211160650520"]
  tags: [ios, objc, memory_leak, retain_cycle, async_block_uses_self, context_aware_suggestion]
