id: TYPESCRIPT_CYCLOMATIC_COMPLEXITY_THRESHOLD
enabled: true
name: "TypeScript 单函数圈复杂度大于 20"
severity: warn
applies_to:
  languages: [typescript]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: cyclomatic_complexity
      op: at_least
      threshold: 21
meta:
  rationale: "圈复杂度大于 20 的 TypeScript 函数分支组合过多，难以测试和维护。"
  fix_suggestion: "当前函数圈复杂度超过 20 阈值，需要优化；保留原函数入口，将条件判定、数据转换和副作用提取为命名函数。"
  references: ["McCabe cyclomatic complexity"]
  tags: [typescript, desktop, code_quality, cyclomatic_complexity, ast]
