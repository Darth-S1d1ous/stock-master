id: OBJC_CYCLOMATIC_COMPLEXITY_THRESHOLD
enabled: true
name: "Objective-C/Objective-C++ 单方法圈复杂度大于 20"
severity: warn
applies_to:
  languages: [objc, objcpp]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: cyclomatic_complexity
      op: at_least
      threshold: 21
meta:
  rationale: "圈复杂度大于 20 的 Objective-C 方法分支组合过多，难以验证生命周期和错误路径。"
  fix_suggestion: "当前函数圈复杂度超过 20 阈值，需要优化；保留原方法入口，将字典解析、状态判断和回调处理提取为私有方法。"
  tapd_ids: ["1070112211160112118"]
  tags: [ios, objc, objcpp, code_quality, cyclomatic_complexity, ast]
