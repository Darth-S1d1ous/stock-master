# JNI LocalRef 必须 DeleteLocalRef
# TAPD Bug 1070112211158486006（JNI Local Ref 用后必须 DeleteLocalRef）
# 调研报告：/Users/endywang/Dev/yuanbao/evl/TAPD/research/rules/22-jni-local-ref-must-delete.md
id: JNI_LOCALREF_MUST_DELETE
enabled: true
name: "JNI LocalRef 必须 DeleteLocalRef"
severity: error
engine_requires: [ast]
applies_to:
  languages: [cpp]
patterns:
  - id: jni_call_jobject
    spec:
      type: Any
      value:
        - { type: Call, value: { name: "CallStaticObjectMethod" } }
        - { type: Call, value: { name: "CallObjectMethod" } }
        - { type: MethodCall, value: { method: "CallStaticObjectMethod" } }
        - { type: MethodCall, value: { method: "CallObjectMethod" } }
  - id: delete_local_ref
    spec:
      type: Any
      value:
        - { type: Call, value: { name: "DeleteLocalRef" } }
        - { type: MethodCall, value: { method: "DeleteLocalRef" } }
conditions:
  all:
    - kind: PairedWith
      node: jni_call_jobject
      pair_with: delete_local_ref
      # 修复（task #326 审计）：scope 从 file 收紧为 function
      # file scope 会导致跨函数误判（同文件不同函数的 DeleteLocalRef 被当作配对）
      paired_scope: function
meta:
  rationale: |
    JNI LocalRef 不释放会溢出 LocalRef 表导致崩溃。
    file_keyword_exclude 排除 OptionalToJava/jni_optional.h（helper 返回 LocalRef 给调用者）。
  fix_suggestion: |
    // 在报告的 {{method_name}} 方法内，CallStaticObjectMethod 返回的 jobject
    // 必须在使用后调用 DeleteLocalRef：
    // 例（JNI helper 不接管所有权的场景）：
    auto result = env->CallStaticObjectMethod(clazz, method);
    // ... 使用 result ...
    env->DeleteLocalRef(result);  // 显式释放 LocalRef
    // 注意：Jstring2String 内部不 DeleteLocalRef（仅做类型转换），
    // 调用方仍需对 jobject 显式 DeleteLocalRef。Jstring2String 不在 #exclude 内。
    // 工厂模式豁免：成对 Create/Release（jobject）的工厂类由 Release 负责释放，跳过整文件。
    #exclude: OptionalToJava, jni_optional.h, void Release(jobject
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：提取 LocalRef 变量名和后续直接 return 表达式；先保存转换
  # 结果，再释放 LocalRef，最后返回保存值。不能在 LocalRef 最后一次使用前释放。
  fix_suggestion_template:
    strategy: release_after_last_use
    template: |
      // JNI LocalRef 必须在最后一次使用后释放；直接 return 时先保存转换结果。
    release_statement: '{{env_name}}->DeleteLocalRef({{var_name}});  // 最后一次使用后显式释放'
    extractors:
      var_name:
        from: issue_line
        regex: '(?:auto|jstring|jobject)\s+(\w+)\s*=\s*[^;]*Call(?:Static)?Object(?:Method)?'
        group: 1
        default: result
      env_name:
        from: issue_line
        regex: '(\w+)\s*->\s*Call(?:Static)?Object(?:Method)?'
        group: 1
        default: env
  references: ["CWE-401"]
  tapd_ids: ["1070112211158486006"]
  tags: [jni, memory_leak, cpp, file_keyword_exclude, context_aware_suggestion]
