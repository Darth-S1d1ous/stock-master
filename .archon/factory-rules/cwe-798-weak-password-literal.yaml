# CWE-798 弱密码 / 弱 token 字面量（LiteralEntropy 检测）
# Phase A：LiteralEntropyFilter Shannon entropy < 3.0 + 长度 ≥ 6
# 关键 FP 防护：变量名必须含 password/secret/token/apiKey/credential 才检测
# 排除：日志格式串、字典 key、枚举值、日期格式
id: CWE_798_WEAK_PASSWORD_LITERAL
enabled: true
name: "弱密码/弱 token 字面量（CWE-798）"
severity: error
engine_requires: [regex]
applies_to:
  languages: [kotlin, java, cpp, c]
  # 排除测试文件（test_token = "xxx" 在测试代码中合法）
  # 排除 mocks / fakes / fixtures 目录
  exclude_glob:
    - "**/*test*"
    - "**/*Test*"
    - "**/*mock*"
    - "**/*Mock*"
    - "**/*fake*"
    - "**/*Fake*"
    - "**/*fixture*"
    - "**/*Fixture*"
    - "**/__tests__/**"
    - "**/tests/**"
patterns:
  - id: sensitive_string_assignment
    spec:
      type: Raw
      value:
        # 双重过滤：
        # 1. 变量名必须含 password/secret/token/apiKey/credential（大小写不敏感）
        # 2. 字符串字面量长度 ≥ 6，排除空串、format string（含 %）、路径（含 / \）
        # FP 防护：引号内排除 < > + 字符 —— 防止匹配日志格式串 `<< ", token: "`
        #          和字符串拼接 `password + "xxx"`
        # 例：val password = "abc123"           → TP
        # 例：log_info << ", token: " << token  → TN（引号内是空，且整体是日志格式）
        # 例：val name = "photoUpload"          → TN（变量名不含敏感关键词）
        pattern: '(?i)\b\w*(password|secret|token|apikey|api_key|credential)\w*\s*[:=]\s*"([^"%/\\<>+]{6,})"'
conditions:
  all:
    - kind: InModule
      module_glob: "**/**"
meta:
  rationale: |
    弱密码（"password"/"123456"）和弱 token 字面量容易被暴力破解或字典攻击。
    Shannon entropy < 3.0 + 长度 ≥ 6 是经验阈值：
    - "password" entropy ≈ 2.75 → 弱
    - "x7K9mP2qR4" entropy ≈ 3.32 → 可接受
    正确做法：从 Keychain / Keystore / BuildConfig 读取，避免硬编码。

    FP 防护：变量名必须含敏感关键词（password/secret/token 等），
    避免误报字典 key（"cid"）、日志格式串（"msg_id: "）、枚举值（"photoUpload"）。
  fix_suggestion: |
    // 当前代码（弱密码硬编码）：
    val password = "password"
    // 修复后（从 Keychain 读取）：
    val password = Keychain.read("user_password")
  references: ["CWE-798", "OWASP:A07"]
  tapd_ids: []
  tags: [kotlin, java, cpp, security, cwe-798, literal_entropy_check]
  literal_entropy:
    # 阈值 2.8：保留 "password"(2.75) TP，过滤 "X-Token"(2.81) / "test-token"(2.65)
    # 经验：纯小写字母常见单词 entropy ≈ 2.5-2.9，含混合字符的强密码 entropy > 3.5
    min_threshold: 2.8
    min_length: 6
