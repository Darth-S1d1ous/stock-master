id: KOTLIN_FUNCTION_LENGTH_THRESHOLD
enabled: true
name: "Kotlin 单方法有效代码行大于 80"
severity: warn
applies_to:
  languages: [kotlin]
engine_requires: [ast]
conditions:
  all:
    - kind: Count
      count_kind: function_length
      op: at_least
      threshold: 81
meta:
  rationale: "方法有效代码行不含空行和纯注释行；超过 80 行通常意味着职责过多。"
  fix_suggestion: "当前函数有效代码行超过 80 行阈值，需要优化；保留原方法入口，按状态计算、UI 更新和副作用阶段提取私有函数。"
  references: ["Archon effective method length policy"]
  tags: [kotlin, android, code_quality, function_length, ast]
