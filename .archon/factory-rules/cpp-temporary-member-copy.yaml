# C++ 临时对象成员复制（C1：局部绑定复制）
# TAPD Bug 1070112211162056423：chat_input_model_select_project_handler.cc:929
# 反模式：const auto x = obj.method().field;
# - obj.method() 返回 by value（临时对象）
# - .field 访问临时对象的成员
# - 绑定到 auto 变量时是复制（不是移动），临时量析构 → std::string 深拷贝
#
# AST 精确化：by_value_return_check PostFilter 在 issue 报告后检查 method() 返回类型
# - by value → TP，保留
# - const& / & → FP，drop
# - 声明找不到 → borderline，drop（保守）
id: CPP_TEMPORARY_MEMBER_COPY
enabled: true
name: "C++ 临时对象成员复制：auto x = obj.method().field 应延长临时量生命周期"
severity: warn
engine_requires: [regex]
applies_to:
  languages: [cpp]
patterns:
  - id: auto_temporary_member
    spec:
      type: Raw
      value:
        # auto/var/const auto + 标识符 + = + 任意 receiver + .method() + .field
        # auto/var/const auto + 标识符 + = + receiver + .method() + .field + 行尾
        # 行尾必须是 `;` 或 `,`（排除 `.method()` 形式 — `.size()` 不是字段访问）
        pattern: '(?:const\s+)?(?:auto|var)\s+\w+\s*=\s*\w+(?:->|\.)\w+\s*\(\s*\)\s*\.\w+\s*(?:[;,]|$)'
conditions:
  all:
    - kind: InModule
      module_glob: "**/dtmp/**"
meta:
  rationale: |
    C++ 临时对象生命周期规则：`obj.method()` 返回 by value 时，整个表达式
    在 `;` 处析构。绑定 `const auto x = obj.method().field` 触发复制而非移动
    （因为 field 是临时对象的成员，无法 move-out 单个字段），产生 std::string
    等深拷贝。

    TAPD Bug 1070112211162056423：team_id 从临时 TeamInfo 对象复制绑定，
    产生不必要 std::string 深拷贝。

    正确写法：先延长临时量生命周期，再用 const ref 绑定成员：
    ```cpp
    auto team_info_val = account->team_info();       // 延长 TeamInfo 生命周期
    const auto& team_id = team_info_val.team_id;     // const ref 绑定，0 拷贝
    ```

    精确化：by_value_return_check PostFilter 在 issue 报告后做 AST 检查：
    - 在同文件内查 method() 声明
    - 返回类型 by value → TP（保留）
    - 返回类型 const T& 或 T& → FP（drop，引用访问无复制）
    - 声明找不到 → borderline（drop，保守避免 FP）
  fix_suggestion: |
    // 当前代码（深拷贝）：
    const auto team_id = account->team_info().team_id;

    // 修复后（延长生命周期 + const ref）：
    auto team_info_val = account->team_info();
    const auto& team_id = team_info_val.team_id;
  fix_suggestion_template:
    template: |
      // {{var_name}} 从临时对象 {{method_name}}().{{field_name}} 复制绑定 → 深拷贝
      - {{original_line}}
      + {{indent}}auto __tmp = {{receiver_expr}}.{{method_name}}();  // 延长临时量生命周期
      + {{indent}}const auto& {{var_name}} = __tmp.{{field_name}};   // const ref，0 拷贝
    extractors:
      var_name:
        from: issue_line
        regex: '(?:const\s+)?(?:auto|var)\s+(\w+)\s*='
        group: 1
        default: 'x'
      receiver_expr:
        from: issue_line
        regex: '=\s*(\w+(?:->\w+)*)\.'
        group: 1
        default: 'obj'
      method_name:
        from: issue_line
        regex: '\.(\w+)\s*\(\s*\)\s*\.'
        group: 1
        default: 'method'
      field_name:
        from: issue_line
        regex: '\(\s*\)\s*\.(\w+)'
        group: 1
        default: 'field'
  references: ["clang-tidy:performance-unnecessary-copy-initialization"]
  tapd_ids: ["1070112211162056423"]
  tags: [cpp, performance, code_quality, copy, temporary_lifetime, by_value_return_check, context_aware_suggestion]
