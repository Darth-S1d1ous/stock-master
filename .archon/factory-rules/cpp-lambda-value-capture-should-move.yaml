# lambda 值捕获（大对象）应 std::move 进捕获（减少深拷贝）
# TAPD Bug 1070112211161760758 P2：project_biz_service_impl.cc:1299
#
# CPG 级检测：VariableTypeIsLarge（类型推断）+ VariableDeadAfter（活跃变量分析）
# 仅当变量是大对象类型（std::string/vector/map 等）且捕获后不再使用时才报告
id: CPP_LAMBDA_VALUE_CAPTURE_SHOULD_MOVE
enabled: true
name: "C++ lambda 值捕获大对象（std::string 等）后不再使用，应 std::move 进捕获"
severity: warn
engine_requires: [cpg, regex]
applies_to:
  languages: [cpp]
patterns:
  # 匹配 lambda 值捕获：[xxx](...) { 或 [xxx] { 形式
  # 要求 { 紧随 []（排除数组下标 [idx]( 和 map 查找 [key].method()）
  - id: lambda_value_capture
    spec:
      type: Raw
      value:
        pattern: '\[(\w+)(?:\s*,\s*\w+)*\]\s*(?:\([^)]*\)\s*)?\{'
conditions:
  all:
    - kind: InModule
      module_glob: "**/dtmp/**"
    # CPG 类型推断：变量必须是大对象类型（std::string/vector/map 等）
    # 自动排除 int/bool/char/指针/weak_ptr/shared_ptr 等小类型
    - kind: VariableTypeIsLarge
    # CPG 活跃变量分析：变量在 lambda 捕获后不再被引用（可以安全 move）
    # 排除变量后续仍被使用的场景（move 会导致 use-after-move）
    - kind: VariableDeadAfter
meta:
  rationale: |
    lambda 值捕获 [var] 会触发 std::string 深拷贝。如果 var 在 lambda 外层
    不再使用，应该用 [var = std::move(var)] 把所有权转移进捕获，消除拷贝。

    CPG 级精确检测（VariableTypeIsLarge + VariableDeadAfter）：
    1. VariableTypeIsLarge：从 AST 提取变量类型，仅大对象（std::string/vector/map）才报告
       自动排除 int/bool/char/指针/weak_ptr/shared_ptr 等小类型
    2. VariableDeadAfter：活跃变量分析，检查变量在捕获后是否仍被引用
       仅当变量"已死亡"（可安全 move）时才报告

    反模式：
      auto project_id = ...;
      service->Call([project_id](...) { ... });  // 值捕获（多余深拷贝）
      // project_id 此后不再使用

    修复后：
      service->Call([project_id = std::move(project_id)](...) { ... });
  fix_suggestion: |
    // 当前代码（值捕获，多余深拷贝）:
    [project_id](bool success) { ... }

    // 修复后（move 进捕获）:
    [project_id = std::move(project_id)](bool success) { ... }
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：在原 capture list 中把 [var] 替换为 [var = std::move(var)]，
  # 保留 capture list 其他变量、参数列表、lambda body 不变。
  # 用 replace_with 模式：regex 匹配 [var] 子串，replace_with 引用 capture group。
  fix_suggestion_template:
    template: |
      // lambda 值捕获 {{var_name}} 触发 std::string 深拷贝；若 {{var_name}} 在外层不再使用，应 move 进捕获
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      var_name:
        from: issue_line
        regex: '\[\s*([^\]&=][^,\]]*?)(?:\s*,\s*[^\]]*)?\]\s*(?:\([^)]*\)\s*)?\{'
        group: 1
      var_name:
        from: issue_line
        # 匹配 capture list 首个可 move 变量（跳过 this 指针 / & 引用 / = init）
        # 支持 [var] / [this, var] / [a, b] 等
        regex: '\[\s*(?:this\s*,\s*)?(\w+)'
        group: 1
        default: var
      fixed_line:
        from: issue_line
        # 匹配 capture list 首个可 move 变量（跳过 this），replace 为 var = std::move(var)
        # 保留 this 前缀（如有）+ 其他 capture + 参数 + body
        # group1=可选 this 前缀，group2=首变量名
        regex: '\[\s*((?:this\s*,\s*)?)(\w+)'
        replace_with: '[$1$2 = std::move($2)'
  references: ["clang-tidy:performance-unnecessary-copy-initialization"]
  tapd_ids: ["1070112211161760758"]
  tags: [cpp, performance, copy, lambda, std::move, context_aware_suggestion, cpg]
