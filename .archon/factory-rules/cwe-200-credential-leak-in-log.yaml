# CWE-200 敏感信息日志泄漏（LiteralBlacklist 检测）
# Phase A：LiteralBlacklistFilter 检查日志调用行的敏感关键词
# 覆盖：Kotlin log.info() / Java logger.severe() / C++ log_info << / Swift os_log
id: CWE_200_CREDENTIAL_LEAK_IN_LOG
enabled: true
name: "敏感凭证（password/secret/token）流入日志（CWE-200）"
severity: error
engine_requires: [regex]
applies_to:
  languages: [cpp, c]
patterns:
  - id: log_call_with_var
    spec:
      type: Raw
      value:
        # 严格匹配：日志调用 + 凭证变量作为 stream 操作数（裸 identifier）
        # 形式 1（C++）：log_info << ... << password / log_info << token
        # 形式 2（Kotlin/Java）：log.info(password) / logger.severe(token)
        #
        # 关键：变量名后必须直接跟 stream 终止符（; / << / ) / + / ,），允许中间空格
        # 排除：token.size() / token.empty()（变量后跟 `.`）
        # 排除：字符串字面量内的描述（"get token start"）
        #
        # Rust regex 不支持 lookahead，用直接包含终止符方式
        pattern: 'log_(?:info|error|warn|debug)\s*<<(?:[^;"]|"[^"]*")*<<\s*(password|secret|token|apikey|api_key|credential)\s*(?:;|<<|[)+,])'
conditions:
  all:
    - kind: InModule
      module_glob: "**/**"
meta:
  rationale: |
    将 password/secret/token 等敏感凭证直接打印到日志，会暴露在 logcat / 调试输出 / 崩溃报告中，
    被第三方组件或攻击者获取。
    正确做法：脱敏后输出（如 "****"）或完全移除日志。
  fix_suggestion: "保留原日志文本，移除敏感值输出或把敏感操作数替换为脱敏值 \"****\""
  fix_suggestion_template:
    template: |
      // 保留原日志结构，只对敏感凭证操作数做脱敏：
      - {{original_line}}
      + {{fixed_line}}
    extractors:
      fixed_line:
        from: issue_line
        regex: '<<\s*(password|secret|token|apikey|api_key|credential)\b'
        replace_with: '<< "****"'
  references: ["CWE-200", "OWASP:A09"]
  tapd_ids: []
  tags: [cpp, c, security, cwe-200, literal_blacklist_check, context_aware_suggestion]
  literal_blacklist:
    keywords: ["password", "secret", "token", "apikey", "api_key", "credential"]
