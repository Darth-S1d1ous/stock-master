# DTMP 加号面板任务类原子能力必须纳入键盘回弹白名单
# TAPD Bug 1070112211161295446：任务模式 6 个 skill 未纳入键盘回弹白名单
id: ANDROID_TASK_SKILL_KEYBOARD_RESTORE_WHITELIST
enabled: true
name: "DTMP restore_keyboard_skills 白名单必须包含全部任务类 skill 常量"
severity: error
engine_requires: [ast, regex]
applies_to:
  languages: [cpp]
patterns:
  - id: restore_keyboard_skills_list
    spec:
      type: Raw
      value:
        pattern: 'restore_keyboard_skills\s*[=\{]'
  - id: all_task_skill_constants
    spec:
      type: All
      value:
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdWorkingAgent" } }
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdTeachingAssistant" } }
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdInvestmentAnalysis" } }
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdPersonalPlan" } }
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdDataAnalysis" } }
        - { type: VariableUse, value: { var_ref: "kAtomicSkillIdPptGeneration" } }
conditions:
  all:
    - kind: NotHas
      node: all_task_skill_constants
    - kind: InModule
      module_glob: "**/dtmp/**"
meta:
  rationale: |
    DTMP 加号面板的"键盘回弹白名单"决定了一个原子能力被点击后，
    关闭加号面板时键盘是否需要主动回弹（kShow）。

    如果白名单遗漏了某个任务类 skill：
    1. 用户先选「联网搜索」（白名单内）→ 键盘弹起，底部加锁
    2. 用户切到任务模式（白名单外）→ keyboard_action=kKeep 不操作键盘
    3. 加锁未释放 + 键盘实际不可见 → 底部出现白屏占位
    4. 用户感知：输入框变白，无 hint、无光标、点击无反应

    DTMP 下沉时白名单只搬运了 AI写作/翻译/AI出卷 3 个 skill，
    后续新增的 6 个任务类 skill 必须同步登记到白名单。

    规则化目的：把"白名单完整性"前置到 PR 检查，避免新增 skill 时遗漏。
  fix_suggestion: |
    // 在 restore_keyboard_skills 列表中追加所有任务类 skill 常量：
    DTMP::kAtomicSkillIdWorkingAgent,
    DTMP::kAtomicSkillIdTeachingAssistant,
    DTMP::kAtomicSkillIdInvestmentAnalysis,
    DTMP::kAtomicSkillIdPersonalPlan,
    DTMP::kAtomicSkillIdDataAnalysis,
    DTMP::kAtomicSkillIdPptGeneration,
  # 声明式 context_aware_suggestion（task #335）
  # 真实修复规律：任务模式 6 个 skill 未纳入键盘回弹白名单，会被误判为不需要回弹
  # 静态建议追加 6 个 skill 常量
  fix_suggestion_template:
    template: |
      // 任务模式 6 个 skill 未纳入键盘回弹白名单，会被误判为不需要回弹
      - {{original_line}}
      + {{indent}}// 在 restore_keyboard_skills 列表中追加:
      + {{indent}}DTMP::kAtomicSkillIdWorkingAgent,
      + {{indent}}DTMP::kAtomicSkillIdTeachingAssistant,
      + {{indent}}DTMP::kAtomicSkillIdInvestmentAnalysis,
      + {{indent}}DTMP::kAtomicSkillIdPersonalPlan,
      + {{indent}}DTMP::kAtomicSkillIdDataAnalysis,
      + {{indent}}DTMP::kAtomicSkillIdPptGeneration,
  references: []
  tapd_ids: ["1070112211161295446"]
  tags: [android, cpp, dtmp, state_machine, whitelist, keyboard, ime, skill_id, context_aware_suggestion]
