name: CI

on: 
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check app tests

      - name: Run tests with coverage
        run: python -m pytest -m "not integration"

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: PostgreSQL Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stock_master_test
          POSTGRES_PASSWORD: stock_master_test_password
          POSTGRES_DB: stock_master_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stock_master_test -d stock_master_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      RUN_POSTGRES_INTEGRATION: "1"
      POSTGRES_USER: stock_master_test
      POSTGRES_PASSWORD: stock_master_test_password
      POSTGRES_DB: stock_master_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Verify single Alembic head
        run: |
          head_count="$(alembic heads | wc -l | tr -d ' ')"
          test "$head_count" = "1"

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration --no-cov

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    env:
      BACKEND_API_URL: http://127.0.0.1:8000
      BACKEND_API_TOKEN: ci-placeholder-token
      WEB_ADMIN_PASSWORD: ci-placeholder-password
      WEB_SESSION_SECRET: ci-placeholder-session-secret-at-least-32-characters

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend checks
        run: npm run check

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage
          if-no-files-found: warn
          retention-days: 7